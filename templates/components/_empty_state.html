{# Componente de estado vazio reutilizavel. #}
{# Parametros esperados: icon_path, title, subtitle, action_url, action_label. #}

<div class="panel panel-soft p-8 sm:p-12 text-center">
  <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center">
    <svg class="w-7 h-7 text-on-surface-variant/55" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      {% if icon_path %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="{{ icon_path }}"/>
      {% else %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
      {% endif %}
    </svg>
  </div>

  <h3 class="text-base sm:text-lg font-semibold text-on-surface">
    {{ title|default:"Nenhum item encontrado" }}
  </h3>

  {% if subtitle %}
    <p class="mt-2 text-sm sm:text-[15px] text-on-surface-variant/62 max-w-xl mx-auto">
      {{ subtitle }}
    </p>
  {% endif %}

  {% if action_url %}
    <div class="mt-6">
      <a href="{{ action_url }}" class="btn btn-primary px-4 py-2.5 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        {{ action_label|default:"Criar" }}
      </a>
    </div>
  {% endif %}
</div>
