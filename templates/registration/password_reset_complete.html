{% extends "base.html" %}

{% block title %}Senha atualizada - Prof Toni Coimbra{% endblock %}

{% block body %}
<div class="relative min-h-screen overflow-hidden bg-surface">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(16,185,129,.14),transparent_26%),radial-gradient(circle_at_bottom_right,rgba(6,182,212,.12),transparent_30%),linear-gradient(180deg,rgba(255,255,255,.02),transparent_30%)]"></div>
  <div class="relative mx-auto flex min-h-screen w-full max-w-3xl items-center px-4 py-10 sm:px-6 lg:px-8">
    <div class="w-full rounded-[1.5rem] border border-outline-variant/10 bg-surface-container-low p-6 shadow-[0_24px_80px_rgba(0,0,0,.28)] sm:p-8">
      <p class="text-xs font-semibold uppercase tracking-[0.22em] text-primary">Pronto</p>
      <h1 class="mt-3 text-3xl font-semibold tracking-tight text-on-background">Senha atualizada com sucesso</h1>
      <p class="mt-3 max-w-2xl text-sm leading-7 text-on-surface-variant/70">
        Sua nova senha ja esta ativa. Voce pode entrar novamente no painel administrativo.
      </p>

      <a href="{% url 'login' %}" class="mt-6 inline-flex items-center justify-center gap-2 rounded-2xl border border-primary/20 bg-primary px-5 py-3 text-sm font-semibold text-on-primary transition-colors hover:bg-primary/90">
        Ir para o login
      </a>
    </div>
  </div>
</div>
{% endblock %}
