<td class="w-[5.75rem] min-w-[5.75rem] px-3 py-3 text-center align-middle transition-colors group-hover:bg-surface-container-high/20">
  {% if readonly %}
    <span class="mx-auto inline-flex h-11 w-11 items-center justify-center rounded-2xl border transition-colors
                 {% if realizada %}
                   border-emerald-400/30 bg-emerald-500/15 text-emerald-200
                 {% else %}
                   border-outline-variant/15 bg-background/70 text-on-surface-variant/55
                 {% endif %}">
      {% if realizada %}
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
      {% else %}
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke-width="1.8" />
        </svg>
      {% endif %}
    </span>
  {% else %}
    <form method="post"
          action="{% url 'turmas:tarefas_toggle' turma.pk tarefa.pk aluno.pk %}"
          hx-post="{% url 'turmas:tarefas_toggle' turma.pk tarefa.pk aluno.pk %}"
          hx-target="closest td"
          hx-swap="outerHTML">
      {% csrf_token %}
      <button type="submit"
              hx-disabled-elt="this"
              aria-label="Alternar tarefa {{ tarefa.nome }} para {{ aluno.nome }}"
              title="{% if realizacao.realizada %}Marcar como pendente{% else %}Marcar como concluida{% endif %}"
              class="group mx-auto inline-flex h-11 w-11 items-center justify-center rounded-2xl border transition-colors
                     {% if realizacao.realizada %}
                       border-emerald-400/30 bg-emerald-500/15 text-emerald-200 hover:bg-emerald-500/20
                     {% else %}
                       border-outline-variant/15 bg-background/70 text-on-surface-variant/55 hover:border-emerald-400/25 hover:bg-surface-container-high hover:text-emerald-200
                     {% endif %}">
        {% if realizacao.realizada %}
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
        {% else %}
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke-width="1.8" />
          </svg>
        {% endif %}
      </button>
    </form>
  {% endif %}
</td>
