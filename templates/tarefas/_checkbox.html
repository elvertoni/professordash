<td class="p-2 text-center">
  <form method="post" action="{% url 'turmas:tarefas_toggle' turma.pk tarefa.pk aluno.pk %}">
    {% csrf_token %}
    <button type="submit"
            hx-post="{% url 'turmas:tarefas_toggle' turma.pk tarefa.pk aluno.pk %}"
            hx-target="closest td"
            hx-swap="outerHTML"
            class="w-8 h-8 rounded-lg flex items-center justify-center mx-auto transition-colors
                   {% if realizacao.realizada %}bg-green-100 text-green-600 border border-green-200
                   {% else %}bg-gray-50 text-gray-300 border border-gray-200 hover:border-gray-300{% endif %}">
      {% if realizacao.realizada %}
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
      {% endif %}
    </button>
  </form>
</td>
