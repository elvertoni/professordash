<div class="space-y-3 p-1">
  <form method="post"
        action="{% url 'turmas:tarefas_editar' turma.pk tarefa.pk %}"
        hx-post="{% url 'turmas:tarefas_editar' turma.pk tarefa.pk %}"
        hx-target="closest th"
        hx-swap="innerHTML"
        class="space-y-3">
    {% csrf_token %}
    <div>
      <label for="edit_nome_{{ tarefa.pk }}" class="mb-1 block text-[11px] font-semibold uppercase tracking-[0.18em] text-on-surface-variant/55">Nome</label>
      <input id="edit_nome_{{ tarefa.pk }}"
             type="text"
             name="nome"
             value="{{ tarefa.nome }}"
             required
             class="w-full rounded-xl border border-outline-variant/15 bg-background px-3 py-2 text-sm text-on-surface outline-none transition focus:border-primary/40 focus:ring-2 focus:ring-primary/20">
    </div>
    <div>
      <label for="edit_data_{{ tarefa.pk }}" class="mb-1 block text-[11px] font-semibold uppercase tracking-[0.18em] text-on-surface-variant/55">Data</label>
      <input id="edit_data_{{ tarefa.pk }}"
             type="date"
             name="data"
             value="{% if tarefa.data %}{{ tarefa.data|date:'Y-m-d' }}{% endif %}"
             class="w-full rounded-xl border border-outline-variant/15 bg-background px-3 py-2 text-sm text-on-surface outline-none transition focus:border-primary/40 focus:ring-2 focus:ring-primary/20">
    </div>
    <div class="flex items-center gap-2">
      <button type="submit"
              class="inline-flex items-center gap-1.5 rounded-full bg-primary px-3 py-1.5 text-xs font-semibold text-on-primary transition-colors hover:bg-primary/90">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Salvar
      </button>
      <a href="{% url 'turmas:tarefas_cabecalho' turma.pk tarefa.pk %}"
         hx-get="{% url 'turmas:tarefas_cabecalho' turma.pk tarefa.pk %}"
         hx-target="closest th"
         hx-swap="innerHTML"
         class="inline-flex items-center gap-1.5 rounded-full border border-outline-variant/15 px-3 py-1.5 text-xs font-medium text-on-surface-variant/70 transition-colors hover:bg-surface-container-high">
        Cancelar
      </a>
    </div>
  </form>
</div>
