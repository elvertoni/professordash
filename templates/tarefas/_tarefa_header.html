<div class="space-y-4">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0 space-y-2">
      <p class="line-clamp-2 text-sm font-semibold leading-5 text-on-surface">{{ tarefa.obj.nome }}</p>
      <div class="flex flex-wrap items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.16em] text-on-surface-variant/50">
        <span class="rounded-full border border-outline-variant/15 bg-background/70 px-2.5 py-1">
          {% if tarefa.obj.data %}{{ tarefa.obj.data|date:"d/m/Y" }}{% else %}Sem data{% endif %}
        </span>
        <span class="rounded-full border border-emerald-400/20 bg-emerald-500/10 px-2.5 py-1 text-emerald-200">
          {{ tarefa.percentual }}%
        </span>
      </div>
    </div>

    {% if not readonly %}
      <div class="flex items-center gap-1">
        <button type="button"
                hx-get="{% url 'turmas:tarefas_editar' turma.pk tarefa.obj.pk %}"
                hx-target="#tarefa-header-{{ tarefa.obj.pk }}"
                hx-swap="innerHTML"
                class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-outline-variant/15 bg-background/70 text-on-surface-variant/60 transition-colors hover:bg-surface-container-high hover:text-primary"
                title="Editar tarefa">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        </button>
        <form method="post"
              action="{% url 'turmas:tarefas_excluir' turma.pk tarefa.obj.pk %}"
              hx-post="{% url 'turmas:tarefas_excluir' turma.pk tarefa.obj.pk %}"
              hx-confirm="Excluir a tarefa &quot;{{ tarefa.obj.nome }}&quot;? Essa acao nao pode ser desfeita."
              hx-swap="none">
          {% csrf_token %}
          <button type="submit"
                  class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-rose-500/15 bg-rose-500/10 text-rose-200 transition-colors hover:bg-rose-500/15"
                  title="Excluir tarefa">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </form>
      </div>
    {% endif %}
  </div>

  <div class="space-y-2">
    <div class="flex items-center justify-between gap-3 text-[11px] font-medium text-on-surface-variant/60">
      <span>{{ tarefa.total_realizadas }} de {{ total_alunos }}</span>
      <span class="text-on-surface">{{ tarefa.percentual }}%</span>
    </div>
    <div class="h-1.5 overflow-hidden rounded-full bg-background/80">
      <div class="h-full rounded-full bg-emerald-400 transition-all duration-300" style="width: {{ tarefa.percentual }}%"></div>
    </div>
  </div>
</div>
