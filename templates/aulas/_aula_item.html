<article class="aula-item group flex flex-col gap-4 rounded-[1.35rem] border border-outline-variant/10 bg-surface-container-low p-4 transition-all duration-200 hover:border-outline-variant/18 hover:bg-surface-container-high/70 lg:flex-row lg:items-center"
         data-id="{{ aula.pk }}">
  <div class="flex items-center gap-3">
    <div class="shrink-0 cursor-grab rounded-xl border border-outline-variant/10 bg-background/40 p-2 text-on-surface-variant/28 transition-colors group-hover:text-on-surface-variant/55 active:cursor-grabbing">
      <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
        <path d="M7 2a2 2 0 1 0 .001 4.001A2 2 0 0 0 7 2zm0 6a2 2 0 1 0 .001 4.001A2 2 0 0 0 7 8zm0 6a2 2 0 1 0 .001 4.001A2 2 0 0 0 7 14zm6-8a2 2 0 1 0-.001-4.001A2 2 0 0 0 13 6zm0 2a2 2 0 1 0 .001 4.001A2 2 0 0 0 13 8zm0 6a2 2 0 1 0 .001 4.001A2 2 0 0 0 13 14z"/>
      </svg>
    </div>
    <span class="inline-flex h-10 w-10 items-center justify-center rounded-2xl border text-sm font-semibold
                 {% if aula.realizada %}border-primary/20 bg-primary/10 text-primary{% else %}border-outline-variant/10 bg-surface-container-high text-on-surface-variant/60{% endif %}">
      {{ aula.numero }}
    </span>
  </div>

  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap items-center gap-2">
      <a href="{% url 'turmas:aulas_detalhe' pk=turma.pk aula_pk=aula.pk %}"
         class="block min-w-0 text-[15px] font-semibold tracking-tight text-on-surface transition-colors hover:text-primary">
        {{ aula.titulo }}
      </a>
      <span class="inline-flex items-center rounded-full border px-2.5 py-1 text-[11px] font-medium
                   {% if aula.realizada %}border-primary/20 bg-primary/10 text-primary{% else %}border-outline-variant/10 bg-surface-container-high text-on-surface-variant/60{% endif %}">
        {% if aula.realizada %}Concluída{% else %}Pendente{% endif %}
      </span>
    </div>
    <div class="mt-2 flex flex-wrap items-center gap-2 text-[12px] text-on-surface-variant/65">
      <span class="inline-flex items-center gap-1.5 rounded-full border border-outline-variant/10 bg-surface-container-high/60 px-2.5 py-1">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        {% if aula.data %}{{ aula.data|date:"d/m/Y" }}{% else %}Sem data definida{% endif %}
      </span>
      <span class="inline-flex items-center rounded-full border border-outline-variant/10 bg-surface-container-high/60 px-2.5 py-1">Aula {{ aula.numero }}</span>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2 lg:justify-end">
    <button type="button"
            hx-post="{% url 'turmas:aulas_realizada' pk=turma.pk aula_pk=aula.pk %}"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-target="closest article"
            hx-swap="outerHTML"
            hx-disabled-elt="this"
            class="inline-flex items-center rounded-full border px-3.5 py-2 text-[12px] font-medium transition-colors
                   {% if aula.realizada %}border-primary/20 bg-primary/10 text-primary hover:bg-primary/15{% else %}border-outline-variant/10 bg-surface-container-high text-on-surface-variant/60 hover:border-outline-variant/20 hover:bg-surface-container-highest hover:text-on-surface{% endif %}">
      {% if aula.realizada %}Marcar pendente{% else %}Marcar realizada{% endif %}
    </button>
    <a href="{% url 'turmas:aulas_detalhe' pk=turma.pk aula_pk=aula.pk %}"
       target="_blank"
       rel="noopener noreferrer"
       class="inline-flex items-center gap-2 rounded-full border border-outline-variant/10 bg-surface-container-high px-3.5 py-2 text-[12px] font-medium text-on-surface-variant/70 transition-colors hover:border-primary/20 hover:bg-primary/10 hover:text-primary"
       title="Apresentar aula">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="hidden sm:inline">Apresentar</span>
    </a>
    <a href="{% url 'turmas:aulas_editar' pk=turma.pk aula_pk=aula.pk %}"
       class="inline-flex items-center rounded-full border border-outline-variant/10 bg-surface-container-high p-2.5 text-on-surface-variant/65 transition-colors hover:border-outline-variant/20 hover:bg-surface-container-highest hover:text-on-surface"
       title="Editar aula">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
    </a>
    <form id="form-excluir-aula-{{ aula.pk }}" method="post" action="{% url 'turmas:aulas_excluir' pk=turma.pk aula_pk=aula.pk %}" class="hidden">
      {% csrf_token %}
    </form>
    <button type="button"
            @click="$dispatch('modal-confirm', {
              title: 'Excluir aula',
              message: 'Tem certeza que deseja excluir a aula {{ aula.titulo|escapejs }}? Esta ação não pode ser desfeita.',
              confirmLabel: 'Excluir',
              formId: 'form-excluir-aula-{{ aula.pk }}'
            })"
            class="inline-flex items-center rounded-full border border-outline-variant/10 bg-surface-container-high p-2.5 text-on-surface-variant/65 transition-colors hover:border-error/20 hover:bg-error/10 hover:text-error"
            title="Excluir aula">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </button>
  </div>

  <input type="hidden" name="ids[]" value="{{ aula.pk }}">
</article>
