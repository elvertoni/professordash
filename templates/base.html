<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Prof Toni Coimbra{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            surface:                    '#000000',
            'surface-dim':              '#000000',
            'surface-bright':           '#2a2a2a',
            'surface-container-lowest': '#050505',
            'surface-container-low':    '#0d0d0d',
            'surface-container':        '#111111',
            'surface-container-high':   '#1a1a1a',
            'surface-container-highest':'#222222',
            background:                 '#000000',
            primary:                    '#10b981',
            'primary-container':        '#059669',
            secondary:                  '#8b5cf6',
            'secondary-container':      '#7c3aed',
            tertiary:                   '#06b6d4',
            error:                      '#f87171',
            'error-container':          '#991b1b',
            'on-background':            '#e5e2e1',
            'on-surface':               '#e5e2e1',
            'on-surface-variant':       '#a1a1aa',
            'on-primary':               '#000000',
            'on-secondary':             '#ffffff',
            outline:                    '#71717a',
            'outline-variant':          'rgba(255,255,255,.1)',
            'surface-tint':             '#10b981',
            'inverse-surface':          '#e5e2e1',
            'inverse-on-surface':       '#1a1a1a',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="app-shell bg-surface text-on-background antialiased selection:bg-primary/20 selection:text-white">
  {% block body %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
