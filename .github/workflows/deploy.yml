name: Deploy para VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e deploy na VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH na VPS e redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /etc/easypanel/projects/work/professordash/code
            git pull origin main
            docker build -f docker/Dockerfile -t easypanel/work/professordash:latest .
            docker service update \
              --image easypanel/work/professordash:latest \
              --force \
              work_professordash
            echo "Deploy concluído com sucesso."
